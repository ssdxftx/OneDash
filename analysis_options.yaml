include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # TODO(material_ui): Flutter 3.47 renames material.dart to material_ui.dart;
    # 153 lib imports still use the old path. Remove this override once migrated.
    # A warning level is not viable while CI runs analyze with fatal infos.
    # Tracking: docs/qa/v30-ui-fix-receipt.md
    deprecated_member_use: ignore
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - build/**
    - android/**
  language:
    strict-casts: false
    strict-raw-types: false

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_fields: true
    unnecessary_lambdas: true
    use_null_aware_elements: false
    use_super_parameters: true
    always_declare_return_types: true
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_single_cascade_in_expression_statements: true
    directives_ordering: false
