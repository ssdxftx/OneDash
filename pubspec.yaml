name: onedash
description: "OneDash - a single-panel, zero-backend 1Panel Android client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^17.2.1
  dio: ^5.9.2
  flutter_tabler_icons: ^1.43.0
  toastification: ^3.2.0
  re_editor: ^0.9.0
  xterm: ^4.0.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  intl: any
  uuid: ^4.5.3
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.1

  dynamic_color: ^1.9.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.3.9
  json_serializable: ^6.8.0

dependency_overrides:
  path_provider_android: 2.2.22
  path_provider_foundation: 2.5.1

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Subset.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium-Subset.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold-Subset.ttf
          weight: 600
