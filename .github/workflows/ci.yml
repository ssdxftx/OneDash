name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Check error leaks
        run: tool/check_error_leaks.sh

      - name: Check action reachability
        run: tool/check_action_reachability.sh

      - name: Check UI consistency
        run: python3 tool/check_ui_consistency.py

      - name: Check hardcoded english
        run: python3 tool/check_hardcoded_english.py

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage
