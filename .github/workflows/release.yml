name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::Release tag must start with v, got: $TAG"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing repository secret ANDROID_KEY_ALIAS"
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing repository secret ANDROID_KEY_PASSWORD"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/onedash-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/onedash-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/onedash-release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties "$RUNNER_TEMP/onedash-release.jks"

      - name: Resolve version
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building OneDash $VERSION (build ${GITHUB_RUN_NUMBER})"

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Verify
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

      - name: Build signed APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER"

      - name: Build signed app bundle
        run: |
          flutter build appbundle --release \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*-release.apk dist/
          cp build/app/outputs/bundle/release/*.aab dist/
          cd dist
          sha256sum *.apk *.aab > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: onedash-${{ env.TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            PRERELEASE_FLAG=""
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" dist/* \
              --title "OneDash $TAG" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
